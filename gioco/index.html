function txt(key, ...args){
  const e = I18N[key]; if (!e) return key;
  const s = e[LANG_CODES.indexOf(LANG)] ?? e[0];
  if (Array.isArray(s)) return s;
  return args.length ? s.replace(/\{(\d)\}/g, (m, i) => args[i] !== undefined ? args[i] : m) : s;
}

/* ---------- Audio ---------- */
let actx = null, collisionBuf = null;
function initAudio(){
  if (actx) { if (actx.state === "suspended") actx.resume(); return; }
  try{
    actx = new (window.AudioContext || window.webkitAudioContext)();
    fetch("collision.wav").then(r=>r.arrayBuffer()).then(b=>actx.decodeAudioData(b))
      .then(buf=>collisionBuf=buf).catch(()=>{});
  }catch(e){ actx = null; }
}
function noiseHit(dur, freq, vol){
  if (!actx || muted) return;
  const n = Math.floor(actx.sampleRate*dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 2.5);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type="lowpass"; f.frequency.value = freq;
  const g = actx.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
}
function tone(freq, dur, vol, type){
  if (!actx || muted) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
}
const sfx = {
  chop(){ noiseHit(0.18, 900 + Math.random()*400, 0.5); tone(70+Math.random()*20, 0.12, 0.25, "triangle"); },
  smash(){ noiseHit(0.25, 2200, 0.35); },
  crash(){
    if (!actx || muted) return;
    if (collisionBuf){ const s=actx.createBufferSource(); s.buffer=collisionBuf; s.connect(actx.destination); s.start(); }
    noiseHit(0.6, 500, 0.8);
  },
  click(){ tone(660, 0.06, 0.12, "square"); },
  clank(){ tone(1400+Math.random()*300, 0.09, 0.12, "square"); tone(320, 0.12, 0.2, "triangle"); noiseHit(0.08, 5000, 0.35); },
  beamBreak(){ noiseHit(0.8, 900, 0.9); tone(60, 0.4, 0.4, "sawtooth"); [880,1175,1568].forEach((f,i)=>setTimeout(()=>tone(f,0.12,0.12,"square"), 150+i*80)); },

};

/* ---------- Disegno: utilità ---------- */
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function text(str, x, y, size, color, align, stroke, strokeW){
  ctx.font = `900 ${size}px ${FONT}`;
  // le traduzioni possono essere più lunghe: il testo non esce mai dallo schermo
  const mw = ctx.measureText(str).width; if (mw > W-40){ size = Math.floor(size*(W-40)/mw); ctx.font = `900 ${size}px ${FONT}`; }
  ctx.textAlign = align || "center"; ctx.textBaseline = "middle";
  if (stroke){ ctx.lineJoin="round"; ctx.lineWidth = strokeW || size*0.16; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function img(name, x, y, w, h, flip){
  const im = IMG[name]; if (!ok(im)) return;
  if (w === undefined){ w = im.naturalWidth; h = im.naturalHeight; }
  if (flip){ ctx.save(); ctx.translate(x+w, y); ctx.scale(-1,1); ctx.drawImage(im, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(im, x, y, w, h);
}
// Banner stile "PLAY" (giallo con scacchi neri)
function banner(x,y,w,h,label,dark){
  ctx.save();
  const sk = h*0.45;
  ctx.beginPath(); ctx.moveTo(x+sk,y); ctx.lineTo(x+w,y); ctx.lineTo(x+w-sk,y+h); ctx.lineTo(x,y+h); ctx.closePath();
  ctx.fillStyle = dark ? "#111" : YELLOW; ctx.fill();
  if (dark){ ctx.lineWidth = 5; ctx.strokeStyle = YELLOW; ctx.stroke(); }
  ctx.clip();
  const c = h/3;
  ctx.fillStyle = dark ? YELLOW : "#111";
  for (let r=0;r<3;r++) for (let k=0;k<3;k++) if ((r+k)%2===0) {
    const xx = x + sk*(1 - (r+0.5)/3) + k*c*0.95 - 4;
    ctx.beginPath(); ctx.moveTo(xx+c*0.45, y+r*c); ctx.lineTo(xx+c*1.4, y+r*c);
    ctx.lineTo(xx+c*0.95, y+(r+1)*c); ctx.lineTo(xx, y+(r+1)*c); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  fitText(label, x + w/2 + h*0.55, y + h/2 + 2, h*0.52, w - h*1.6, dark ? YELLOW : "#111", "center");
}

// Bottone freccia (giallo con triangolo nero)
function arrowBtn(x,y,w,h,dir){
  ctx.fillStyle = YELLOW; rrect(x,y,w,h,h*0.28); ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = "#111"; ctx.stroke();
  const cx=x+w/2, cy=y+h/2, a=h*0.32;
  ctx.fillStyle = "#111"; ctx.beginPath();
  if (dir<0){ ctx.moveTo(cx-a*1.1,cy); ctx.lineTo(cx+a*0.8,cy-a); ctx.lineTo(cx+a*0.8,cy+a); }
  else { ctx.moveTo(cx+a*1.1,cy); ctx.lineTo(cx-a*0.8,cy-a); ctx.lineTo(cx-a*0.8,cy+a); }
  ctx.closePath(); ctx.fill();
}
/* ---------- Coppa (disegnata) ---------- */
function drawTrophy(cx, cy, size, t){
  const k = size/100; t = t || 0;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k);
  const gold = ctx.createLinearGradient(-40,0,40,0);
  gold.addColorStop(0,"#b8860b"); gold.addColorStop(0.35,"#ffe680"); gold.addColorStop(0.55,"#ffd000"); gold.addColorStop(1,"#a86b00");
  ctx.lineJoin = "round";
  // manici
  ctx.lineWidth = 9; ctx.strokeStyle = "#c99400";
  ctx.beginPath(); ctx.moveTo(-28,-32); ctx.bezierCurveTo(-58,-34,-56,0,-24,4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(28,-32);  ctx.bezierCurveTo(58,-34,56,0,24,4);  ctx.stroke();
  // base
  ctx.fillStyle = "#1a1a1a"; rrect(-30,30,60,18,4); ctx.fill();
  ctx.fillStyle = YELLOW; ctx.fillRect(-30,36,60,5);
  ctx.fillStyle = gold; rrect(-20,22,40,10,3); ctx.fill();
  // stelo
  ctx.beginPath(); ctx.moveTo(-6,8); ctx.lineTo(6,8); ctx.lineTo(10,24); ctx.lineTo(-10,24); ctx.closePath(); ctx.fill();
  // coppa
  ctx.beginPath(); ctx.moveTo(-34,-44); ctx.lineTo(34,-44); ctx.bezierCurveTo(34,-6,16,12,0,12); ctx.bezierCurveTo(-16,12,-34,-6,-34,-44); ctx.closePath();
  ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = "#8a5a00"; ctx.stroke();
  ctx.fillStyle = "#ffeeaa"; ctx.beginPath(); ctx.ellipse(0,-44,34,6,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // stella
  ctx.fillStyle = "#fff8d0"; ctx.beginPath();
  for (let i=0;i<10;i++){ const r = i%2?6:14, a = -Math.PI/2 + i*Math.PI/5; ctx.lineTo(Math.cos(a)*r, -18+Math.sin(a)*r); }
  ctx.closePath(); ctx.fill();
  // riflesso
  ctx.globalAlpha = 0.55; ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.ellipse(-20,-24,4,13,0.25,0,Math.PI*2); ctx.fill();
  // scintilla
  const sp = (Math.sin(t*3)+1)/2; ctx.globalAlpha = sp;
  ctx.translate(26,-46); ctx.rotate(t);
  ctx.beginPath(); for (let i=0;i<8;i++){ const r = i%2?2:10, a = i*Math.PI/4; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);} ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- Arredo dei balconi ---------- */
const FLOWER_COL = ["#b5536a","#b98aa0","#c9a94a","#8f78a8","#d8d2c8","#c07a4a"];   // colori sbiaditi
const DRY = ["#8a7a3a","#7a6630","#9b8a4a","#6b5a2a"];                                  // foglie secche
const pick = a => a[Math.floor(Math.random()*a.length)];
function makeDeco(bw){
  bw = bw || 144;
  const types = ["deadplant","deadflowers","deadtree","cactus","umbrella","sunflower","drybush","tire","trash","chair","tv","box"];
  const nSlots = Math.max(2, Math.floor((bw-20)/28)), slots = [];
  for (let i=0;i<nSlots;i++) slots.push(Math.round(16 + i*(bw-32)/(nSlots-1)));
  slots.sort(()=>Math.random()-0.5);
  const n = Math.min(nSlots, 1 + Math.floor(Math.random()*(nSlots>3?4:3))), items = [];
  let umbrella = false;
  for (let i=0;i<n;i++){
    let t = pick(types);
    if (t==="umbrella"){ if (umbrella) t="deadplant"; umbrella = true; }
    items.push({ t, x: slots[i], c: pick(FLOWER_COL), c2: pick(FLOWER_COL), h: 0.8+Math.random()*0.35, tilt: (Math.random()-0.5)*0.5, seed: Math.random() });
  }
  return { items, box: Math.random()<0.5 ? {c:pick(FLOWER_COL), c2:pick(FLOWER_COL)} : null,
           ivy: Math.random()<0.45 ? {x: 18+Math.random()*(bw-36), c: pick(FLOWER_COL)} : null,
           laundry: Math.random()<0.25 ? {c:[pick(["#9fb3c8","#d9c7a0","#b88","#ccc"]), pick(["#7d8f6a","#a97","#c9c3b5"]), pick(["#888","#b9a27a","#9aa"])]} : null };
}
// vaso crepato (a volte con un pezzo mancante)
function pot(x, y, w, h, col, broken){
  ctx.fillStyle = col || "#a8643f";

// B.9.12: balcone disegnato una volta su una tela, con contorno scuro, poi incollato con ombra → si stacca dallo sfondo
const BAL_PX = 40, BAL_PT = 110, BAL_PB = 110;
function balconySprite(r, slab){
  const key = slab + "|" + r.side + "|" + r.bw + "|" + r.rail;
  if (r._spr && r._spr.key === key && r._spr.deco === r.deco) return r._spr;
  const w = r.bw + BAL_PX*2, h = BAL_PT + BAL_PB, bx = balX(r);
  const raw = document.createElement("canvas"); raw.width = w*RS; raw.height = h*RS;
  const keep = ctx; ctx = raw.getContext("2d");
  try{ ctx.scale(RS, RS); ctx.translate(BAL_PX - bx, BAL_PT); drawBalconyRaw(r, 0, slab); } finally { ctx = keep; }
  const out = document.createElement("canvas"); out.width = raw.width; out.height = raw.height; const o = out.getContext("2d");
  const k = 3*RS; for (const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1],[-.7,-.7],[.7,-.7],[-.7,.7],[.7,.7]]) o.drawImage(raw, dx*k, dy*k);
  o.globalCompositeOperation = "source-in"; o.fillStyle = "#1c130b"; o.fillRect(0, 0, out.width, out.height);
  o.globalCompositeOperation = "source-over"; o.drawImage(raw, 0, 0);

}
function drawBalconyRow(r, by, slab){

function drawBalconyRaw(r, by, slab){

function floorFor(level, themeIdx, variant){

  const ci = level % FACADES.length, key = ci + "_" + themeIdx + "_" + variant;

  let seed = 11 + ci*17 + variant*131; const rnd = ()=> (seed = (seed*9301+49297)%233280)/233280;

  g.fillStyle = F.wall; g.fillRect(0,0,270,196);

/* ---------- Bottoni ---------- */
let pointer = {x:-1, y:-1, mouse:false};
class Button {
  constructor(x,y,w,h,draw,onClick,pad){ Object.assign(this,{x,y,w,h,draw,onClick,pad:pad||14,hover:0,press:0,visible:true}); }
  hit(px,py){ const p=this.pad; return this.visible && px>=this.x-p && px<=this.x+this.w+p && py>=this.y-p && py<=this.y+this.h+p; }
  update(dt){
    const target = (pointer.mouse && this.hit(pointer.x,pointer.y)) ? 1 : 0;
    this.hover += (target - this.hover) * Math.min(1, dt*14);
    this.press = Math.max(0, this.press - dt*6);
  }
  render(){
    if (!this.visible) return;
    const s = 1 + this.hover*0.05 - this.press*0.08;
    ctx.save();
    ctx.translate(this.x+this.w/2, this.y+this.h/2); ctx.scale(s,s); ctx.translate(-this.w/2, -this.h/2);
    this.draw(0,0,this.w,this.h);
    ctx.restore();
  }
}

/* ---------- BANDIERINE (disegnate: le emoji delle bandiere non si vedono su Windows) ---------- */
function drawFlag(code, x, y, w, h){
  ctx.save(); rrect(x, y, w, h, Math.min(w,h)*0.14); ctx.clip();
  const vert = cols => cols.forEach((c,i)=>{ ctx.fillStyle = c; ctx.fillRect(x + i*w/3, y, w/3 + 1, h); });
  const horiz = (cols, parts) => { let yy = y; cols.forEach((c,i)=>{ const hh = h*parts[i]; ctx.fillStyle = c; ctx.fillRect(x, yy, w, hh + 1); yy += hh; }); };
  if (code === "it") vert(["#009246","#ffffff","#ce2b37"]);
  else if (code === "fr") vert(["#0055a4","#ffffff","#ef4135"]);
  else if (code === "de") horiz(["#000000","#dd0000","#ffce00"], [1/3,1/3,1/3]);
  else if (code === "es") horiz(["#aa151b","#f1bf00","#aa151b"], [1/4,1/2,1/4]);
  else if (code === "en"){ // Union Jack semplificata
    ctx.fillStyle = "#012169"; ctx.fillRect(x, y, w, h);
    ctx.lineCap = "butt";
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = h*0.2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+w, y+h); ctx.moveTo(x+w, y); ctx.lineTo(x, y+h); ctx.stroke();
    ctx.strokeStyle = "#c8102e"; ctx.lineWidth = h*0.07;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+w, y+h); ctx.moveTo(x+w, y); ctx.lineTo(x, y+h); ctx.stroke();
    ctx.fillStyle = "#ffffff"; ctx.fillRect(x + w/2 - h*0.17, y, h*0.34, h); ctx.fillRect(x, y + h*0.33, w, h*0.34);
    ctx.fillStyle = "#c8102e"; ctx.fillRect(x + w/2 - h*0.1, y, h*0.2, h); ctx.fillRect(x, y + h*0.4, w, h*0.2);
  }
  ctx.restore();
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(0,0,0,.35)"; rrect(x, y, w, h, Math.min(w,h)*0.14); ctx.stroke();
}

/* ---------- SCELTA LINGUA: bandierina in alto a sinistra con menu a scomparsa ---------- */
const LangUI = {
  open: false, a: 0,
  BX: 24, BY: 24, BW: 96, BH: 64,       // bottone con la bandiera attuale
  OX: 24, OY: 100, OW: 300, OH: 64,     // voci del menu
  on(){ return scene === Menu || scene === Splash; },
  inBtn(x,y){ return x >= this.BX-8 && x <= this.BX+this.BW+8 && y >= this.BY-8 && y <= this.BY+this.BH+8; },
  optAt(x,y){
    if (!this.open || x < this.OX || x > this.OX+this.OW) return -1;
    const i = Math.floor((y - this.OY) / (this.OH + 6));
    return (i >= 0 && i < LANGS.length && y - this.OY - i*(this.OH+6) <= this.OH) ? i : -1;
  },
  // true = il tocco è stato usato dal selettore lingua
  down(x,y){
    if (this.inBtn(x,y)){ this.open = !this.open; sfx.click(); if (scene === Splash) Splash.hold = true; return true; }
    if (!this.open) return false;
    const i = this.optAt(x,y);
    if (i >= 0){ setLang(LANGS[i][0]); sfx.click(); }
    this.open = false;   // tocco fuori dal menu: si chiude e basta
    return true;
  },
  update(dt){ this.a += ((this.open ? 1 : 0) - this.a) * Math.min(1, dt*16); if (!this.on()) { this.open = false; this.a = 0; } },
  render(){
    // bottone
    ctx.fillStyle = "rgba(0,0,0,.6)"; rrect(this.BX, this.BY, this.BW, this.BH, 16); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,230,0,.8)"; ctx.stroke();
    drawFlag(LANG, this.BX+12, this.BY+14, 48, 36);
    ctx.fillStyle = YELLOW; ctx.beginPath();
    const cx = this.BX+77, cy = this.BY+this.BH/2;
    if (this.open){ ctx.moveTo(cx-8, cy+5); ctx.lineTo(cx+8, cy+5); ctx.lineTo(cx, cy-5); }
    else { ctx.moveTo(cx-8, cy-5); ctx.lineTo(cx+8, cy-5); ctx.lineTo(cx, cy+5); }
    ctx.closePath(); ctx.fill();
    if (this.a < 0.02) return;
    // menu a scomparsa
    ctx.save(); ctx.globalAlpha = this.a;
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0, 0, W, H);
    ctx.translate(0, (1 - this.a) * -20);
    ctx.fillStyle = "rgba(10,10,10,.95)"; rrect(this.OX-10, this.OY-10, this.OW+20, LANGS.length*(this.OH+6)+14, 18); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = YELLOW; ctx.stroke();
    LANGS.forEach(([c, n], i)=>{
      const y = this.OY + i*(this.OH+6), cur = c === LANG;
      ctx.fillStyle = cur ? "rgba(255,230,0,.9)" : "rgba(255,255,255,.08)"; rrect(this.OX, y, this.OW, this.OH, 12); ctx.fill();
      drawFlag(c, this.OX+14, y+14, 48, 36);

/* ---------- Particelle (detriti) ---------- */
const parts = [];
function burst(x, y, angleDeg, cone, n, big){
  for (let i=0;i<n;i++){
    const a = (angleDeg + (Math.random()-0.5)*cone) * Math.PI/180;
    const f = 150 + Math.random()*350;
    const chunk = big && Math.random() < 0.35;
    const life = 0.5 + Math.random()*0.6;
    parts.push({ x: x+(Math.random()-0.5)*16, y: y+(Math.random()-0.5)*16,
      vx: Math.cos(a)*f, vy: Math.sin(a)*f - (chunk?120:0),
      life, max: life, rot: Math.random()*6, vr: (Math.random()-0.5)*14,
      s0: chunk ? 18+Math.random()*16 : 8+Math.random()*10, s1: chunk ? 12 : 3,
      col: chunk ? (Math.random()<0.5 ? "#dfe3e8" : "#5b6068") : (Math.random()<0.5 ? [200,170,130] : [160,140,115]),
      chunk });
  }
}
function dust(x, y, n){
  for (let i=0;i<n;i++){
    const life = 0.6+Math.random()*0.5;
    parts.push({ x:x+(Math.random()-0.5)*60, y:y+(Math.random()-0.5)*20, vx:(Math.random()-0.5)*120, vy:-30-Math.random()*60,
      life, max:life, rot:0, vr:0, s0:30+Math.random()*30, s1:70, col:[210,195,170], dust:true });
  }
}
function petals(x, y, deco){
  const cols = DRY.slice(); deco.items.forEach(it=>cols.push(it.c)); if (deco.box) cols.push(deco.box.c, deco.box.c2);
  for (let i=0;i<18;i++){ const a = (200+Math.random()*140)*Math.PI/180, f = 120+Math.random()*260, life = 0.7+Math.random()*0.6;
    parts.push({x:x+(Math.random()-0.5)*80, y, vx:Math.cos(a)*f, vy:Math.sin(a)*f, life, max:life, rot:Math.random()*6, vr:(Math.random()-0.5)*10,
      s0:7, s1:5, col:pick(cols), chunk:true}); }
}
function updateParts(dt){
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.life -= dt;
    if (p.dust){ p.vx*=0.96; p.vy*=0.96; } else p.vy += 1400*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt;
    if (p.life <= 0 || p.y > H+60) parts.splice(i,1);
  }
}
function drawParts(){
  for (const p of parts){
    const t = 1 - p.life/p.max;
    const s = p.s0 + (p.s1-p.s0)*t;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    if (p.dust){ ctx.globalAlpha = 0.35*(1-t); ctx.fillStyle = `rgb(${p.col})`; ctx.beginPath(); ctx.arc(0,0,s/2,0,Math.PI*2); ctx.fill(); }
    else if (p.chunk){ ctx.globalAlpha = Math.min(1, p.life*3); ctx.fillStyle = p.col; ctx.fillRect(-s/2,-s/2,s,s*0.7); }
    else { ctx.globalAlpha = 1-t; ctx.fillStyle = `rgb(${p.col})`; ctx.fillRect(-s/2,-s/2,s,s); }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

const OUTLINE_COL = "#1c130b";
function outlineCanvas(src, px){
  const w = src.naturalWidth || src.width, h = src.naturalHeight || src.height, k = px || 6;   // 6 px a risoluzione doppia = 3 px a schermo
  const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d");
  for (const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1],[-.7,-.7],[.7,-.7],[-.7,.7],[.7,.7]]) g.drawImage(src, dx*k, dy*k);
  g.globalCompositeOperation = "source-in"; g.fillStyle = OUTLINE_COL; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = "source-over"; g.drawImage(src, 0, 0);

}
// disegna fn() su una tela a parte (zona x,y,w,h), le dà il contorno scuro e la incolla con l'ombra
const OL = { a:null, b:null };
function outlineLayer(x, y, w, h, fn){

  a.setTransform(1,0,0,1,0,0); a.clearRect(0, 0, cw, ch); a.setTransform(RS, 0, 0, RS, -x*RS, -y*RS);

/* sfondo della città: tappe disegnate a colori (stesso ordine di CITIES) */
const SCENES = [()=>rivaScene(), trentoScene, bolzanoScene, veronaScene, triesteScene, veneziaScene, padovaScene, bergamoScene, bresciaScene, torinoScene,
  milanoScene, bolognaScene, genovaScene, firenzeScene, napoliScene, bariScene, catanzaroScene, palermoScene, cagliariScene, romaScene];
function drawCityScene(lv, th, alpha){
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.drawImage(SCENES[lv % SCENES.length](), 0, GROUND_Y - 560, W, 560);
  ctx.restore();
}

function fitText(str, x, y, size, maxW, color, align, stroke, sw){
  ctx.font = `900 ${size}px ${FONT}`; const w = ctx.measureText(str).width;
  if (w > maxW) size = Math.floor(size * maxW / w);
  text(str, x, y, size, color, align, stroke, sw);
}

/* ---------- SFONDO ANIMATO DEI MENU (cantiere dal vivo) ---------- */
const MenuBg = {
  init(){
    if (this.rows) return;
    this.t = 0; this.side = 0; this.slide = 1; this.from = 0; this.anim = "idle"; this.animT = 0; this.frame = 0;
    this.next = 1.0; this.cloudX = -100; this.shift = 0; this.chops = 0;
    this.rows = [];
    for (let i=0;i<8;i++){ const side = i<1 ? -1 : (Math.random()<0.5?0:1);
      const r = { y: 850 - i*FLOOR_H, side }; if (side>=0) newBalcony(r); this.rows.push(r); }
  },
  update(dt){
    this.init();
    this.t += dt; this.animT += dt; this.cloudX += 14*dt; if (this.cloudX > W) this.cloudX = -380;
    this.slide = Math.min(1, this.slide + dt/0.12);
    if (this.shift < 0) this.shift = Math.min(0, this.shift + FLOOR_H*dt/0.09);
    this.next -= dt;
    if (this.next <= 0){
      // il demolitore del menu lavora da solo, evitando i balconi
      const land = this.rows.find(r => r.y + FLOOR_H >= ROW_MIN && r.y + FLOOR_H <= ROW_MAX);
      let side = this.side; if (land && land.side >= 0) side = 1 - land.side; else if (Math.random()<0.3) side = 1 - side;
      if (side !== this.side){ this.from = this.side; this.slide = 0; }
      this.side = side; this.anim = "demo"; this.animT = 0;
      const bx = side===0 ? BUILD_X : BUILD_X+BUILD_W;
      burst(bx, 1000, side===0 ? 220 : 320, 100, 18, true); dust(bx, 1060, 3);
      for (const r of this.rows){ r.y += FLOOR_H; if (r.y > H){ r.y -= 8*FLOOR_H; r.side = Math.random()<0.35 ? -1 : (Math.random()<0.5?0:1); if (r.side>=0) newBalcony(r); } }
      this.shift = -FLOOR_H; this.chops++;
      this.next = 0.55 + Math.random()*0.5;
    }
    if (this.anim === "idle") this.frame = Math.floor(this.animT/(1/30)) % 6;
    else { this.frame = Math.floor(this.animT/(1/60)); if (this.frame >= 17){ this.anim="idle"; this.animT=0; this.frame=0; } }
    updateParts(dt);
  },
  render(){
    this.init();
    const g = ctx.createLinearGradient(0,0,0,1100); g.addColorStop(0,"#5ec4ff"); g.addColorStop(1,"#bfe9ff");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    img("cloud", this.cloudX, 360, 363, 141);
    img("cloud", ((this.cloudX + 520) % (W+380)) - 380, 150, 254, 99);
    drawCityScene(Math.min(maxLevel, CITIES.length-1), THEMES[0], 1);

    const mci = Math.min(maxLevel, CITIES.length-1), fv = floorFor(mci, 0);
    for (let k=-1;k<8;k++){ const y = GROUND_Y - k*FLOOR_H + this.shift; ctx.drawImage(floorFor(mci, 0, ((this.chops + k + 3)*7)%3), BUILD_X, y, BUILD_W, FLOOR_H); }
    for (const r of this.rows){
      if (r.side < 0) continue;
      drawBalconyRow(r, r.y + this.shift, FACADES[mci].trim);
    }
    drawExcavator(excavator, (this.anim==="idle"?"idle":"demo")+this.frame, this.side, this.from, this.slide, GROUND_Y, this.t);
    drawParts();
    ctx.fillStyle = "#111"; ctx.fillRect(0, GROUND_Y, W, H-GROUND_Y);
    ctx.save(); ctx.beginPath(); ctx.rect(0,GROUND_Y,W,16); ctx.clip(); ctx.fillStyle = YELLOW; ctx.fillRect(0,GROUND_Y,W,16); ctx.fillStyle="#111";
    for (let x=-20;x<W+20;x+=40){ ctx.beginPath(); ctx.moveTo(x,GROUND_Y+16); ctx.lineTo(x+20,GROUND_Y); ctx.lineTo(x+40,GROUND_Y); ctx.lineTo(x+20,GROUND_Y+16); ctx.fill(); }
    ctx.restore();
  },
  // velo scuro per far leggere i pulsanti
  veil(a){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, `rgba(0,0,0,${a*0.55})`); g.addColorStop(0.45, `rgba(0,0,0,${a*0.25})`); g.addColorStop(1, `rgba(0,0,0,${a*0.85})`);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }
};

/* ---------- SELEZIONE OPERATORE ---------- */
const Select = {
  slide: 0, t: 0,
  enter(){
    this.slide = 0; this.t = 0;
    this.buttons = [
      new Button(40, 960, 150, 90, (x,y,w,h)=>arrowBtn(x,y,w,h,-1), ()=>this.change(-1), 10),
      new Button(530, 960, 150, 90, (x,y,w,h)=>arrowBtn(x,y,w,h,1), ()=>this.change(1), 10),
      new Button(110, 1090, 500, 96, (x,y,w,h)=>banner(x,y,w,h,txt("play")), ()=>go(Game), 14),
      new Button(24, 24, 150, 64, (x,y,w,h)=>{ ctx.fillStyle="rgba(0,0,0,.6)"; rrect(x,y,w,h,16); ctx.fill();
        ctx.lineWidth=3; ctx.strokeStyle="rgba(255,230,0,.8)"; ctx.stroke(); text("◀ " + txt("menu"), x+w/2, y+h/2+2, 22, "#fff"); }, ()=>go(Menu), 8),
      muteBtn(),
    ];
  },
  change(d){ operator = (operator + d + OPERATORS) % OPERATORS; store.set("operator", operator); this.slide = d; sfx.click(); Net.saveProgress(); },
  update(dt){ this.t += dt; MenuBg.update(dt); this.slide *= Math.pow(0.0005, dt); this.buttons.forEach(b=>b.update(dt)); },
  photo(idx, cx, cy, size, alpha){
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.fillStyle = YELLOW; rrect(cx-size/2-9, cy-size/2-9, size+18, size+18, size*0.09+8); ctx.fill();
    ctx.save(); rrect(cx-size/2, cy-size/2, size, size, size*0.09); ctx.clip(); img("op"+OPS[idx], cx-size/2, cy-size/2, size, size); ctx.restore();
    ctx.restore();
  },
  render(){
    MenuBg.render(); MenuBg.veil(1.15);
    img("select", 40, 120, 640, 51);
    // carosello: vicini più piccoli e sfumati ai lati
    const off = this.slide * 300;
    const prev = (operator - 1 + OPERATORS) % OPERATORS, next = (operator + 1) % OPERATORS;
    this.photo(prev, 70 + off, 520, 220, 0.45);
    this.photo(next, 650 + off, 520, 220, 0.45);
    ctx.save(); ctx.shadowColor="rgba(0,0,0,.6)"; ctx.shadowBlur=30; this.photo(operator, 360 + off, 500, 400, 1); ctx.restore();
    // nome
    const nm = IMG["name"+OPS[operator]];
    if (ok(nm)){ const s = Math.min(1.3, 420/nm.naturalWidth), w=nm.naturalWidth*s, h=nm.naturalHeight*s;
      card(360-w/2-28, 742, w+56, h+30);
      img("name"+OPS[operator], 360-w/2, 757, w, h); }
    // pallini
    const dw = 22, x0 = 360 - (OPERATORS-1)*dw/2;
    for (let i=0;i<OPERATORS;i++){ blob(x0+i*dw, 890, i===operator?8:5, i===operator?YELLOW:"rgba(255,255,255,.5)"); }
    text(txt("swipe"), 360, 1005, 20, "#ddd");
    this.buttons.forEach(b=>b.render());
  },
  key(k){ if (k==="ArrowLeft") this.change(-1); else if (k==="ArrowRight") this.change(1);
    else if (k==="Enter"||k===" ") go(Game); else if (k==="Escape") go(Menu); },
  swipeStart:null,
  down(x,y){ if (y>250 && y<940) this.swipeStart = x; },
  up(x){ if (this.swipeStart!==null){ const dx = x - this.swipeStart; if (Math.abs(dx)>50) this.change(dx<0?1:-1); } this.swipeStart=null; },
  tap(x,y){ if (y>380 && y<640 && this.swipeStart!==null){ if (x < 170) this.change(-1); else if (x > 550) this.change(1); } }
};

/* ---------- ESCAVATORE (garage) ---------- */
const Garage = {
  enter(){
    this.t = 0; this.idx = excavator; this.slide = 0; this.anim = "idle"; this.animT = 0; this.nextDemo = 1.2;
    this.playBtn = new Button(110, 1090, 500, 96, (x,y,w,h)=>{ const lk = this.locked(); banner(x,y,w,h, lk ? txt("locked") : txt("play"), lk); },
      ()=>{ if (!this.locked()) go(Game); }, 14);
    this.buttons = [
      new Button(40, 930, 150, 90, (x,y,w,h)=>arrowBtn(x,y,w,h,-1), ()=>this.change(-1), 10),
      new Button(530, 930, 150, 90, (x,y,w,h)=>arrowBtn(x,y,w,h,1), ()=>this.change(1), 10),
      this.playBtn,
      new Button(24, 24, 150, 64, (x,y,w,h)=>{ ctx.fillStyle="rgba(0,0,0,.6)"; rrect(x,y,w,h,16); ctx.fill();
        ctx.lineWidth=3; ctx.strokeStyle="rgba(255,230,0,.8)"; ctx.stroke(); text("◀ " + txt("menu"), x+w/2, y+h/2+2, 22, "#fff"); }, ()=>go(Menu), 8),
      muteBtn(),
    ];
  },
  locked(){ return EXCAVATORS[this.idx].unlock > best; },
  change(d){ this.idx = (this.idx + d + EXCAVATORS.length) % EXCAVATORS.length; this.slide = d; sfx.click();
    if (!this.locked()){ excavator = this.idx; store.set("exc", excavator); Net.saveProgress(); } this.anim="idle"; this.animT=0; },
  update(dt){
    this.t += dt; MenuBg.update(dt); this.slide *= Math.pow(0.0005, dt); this.buttons.forEach(b=>b.update(dt));
    this.animT += dt; this.nextDemo -= dt;
    if (this.nextDemo <= 0 && !this.locked()){ this.anim = "demo"; this.animT = 0; this.nextDemo = 1.4; }
    if (this.anim==="demo" && this.animT >= 17/60){ this.anim = "idle"; this.animT = 0; }
  },
  render(){
    MenuBg.render(); MenuBg.veil(1.2);
    text(txt("choose_exc"), 360, 170, 44, YELLOW, "center", "#000", 8);
    const E = EXCAVATORS[this.idx], lk = this.locked();
    const frame = this.anim==="idle" ? "idle" + (Math.floor(this.animT*30)%6) : "demo" + Math.min(16, Math.floor(this.animT*60));

    ctx.fillStyle = "rgba(255,230,0,.18)"; ctx.beginPath(); ctx.ellipse(360 + this.slide*300, 690, 260, 34, 0, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,230,0,.6)"; ctx.stroke();
    ctx.save(); ctx.globalAlpha = lk ? 0.35 : 1;
    const k = 1.55; ctx.translate(360 + this.slide*300, 690); ctx.scale(k,k); ctx.translate(-(IN_L - IDLE_W*E.s/2) - 40, -GROUND_Y);
    drawExcavator(this.idx, frame, 0, 0, 1, GROUND_Y, this.t);
    ctx.restore();
    // scheda
    card(110, 735, 500, 150);
    text(E.name, 360, 780, 40, "#fff");
    fitText(txt("exc" + this.idx), 360, 822, 22, 470, "#ccc");
    if (lk){ fitText(txt("unlock", E.unlock, best), 360, 858, 20, 470, "#ff7a70"); }
    else text(excavator === this.idx ? txt("selected") : "", 360, 858, 22, "#3ddc4a");
    const dw = 26, x0 = 360 - (EXCAVATORS.length-1)*dw/2;
    for (let i=0;i<EXCAVATORS.length;i++) blob(x0+i*dw, 975, i===this.idx?8:5, i===this.idx?YELLOW:(EXCAVATORS[i].unlock>best?"rgba(255,255,255,.25)":"rgba(255,255,255,.6)"));
    this.buttons.forEach(b=>b.render());
  },
  key(k){ if (k==="ArrowLeft") this.change(-1); else if (k==="ArrowRight") this.change(1);
    else if ((k==="Enter"||k===" ") && !this.locked()) go(Game); else if (k==="Escape") go(Menu); },
  swipeStart:null,
  down(x,y){ if (y>250 && y<900) this.swipeStart = x; },
  up(x){ if (this.swipeStart!==null){ const dx = x - this.swipeStart; if (Math.abs(dx)>50) this.change(dx<0?1:-1); } this.swipeStart=null; }
};

/* ---------- SCORRIMENTO VERTICALE (Roadmap e scelta della città): dito, mouse o rotellina ---------- */
const Scroller = {
  make(min, max, start){ return { s: start, min, max, drag: null, vel: 0 }; },
  down(o, y){ o.drag = { y, s: o.s, moved: 0, last: y }; o.vel = 0; },
  move(o, y){ if (!o.drag) return; o.drag.moved = Math.max(o.drag.moved, Math.abs(y - o.drag.y)); o.vel = y - o.drag.last; o.drag.last = y;
    o.s = Math.min(o.max, Math.max(o.min, o.drag.s + (y - o.drag.y))); },
  up(o){ const tap = o.drag && o.drag.moved < 12; o.drag = null; return tap; },
  wheel(o, dy){ o.s = Math.min(o.max, Math.max(o.min, o.s - dy)); },
  update(o, dt){ if (!o.drag && Math.abs(o.vel) > 0.3){ o.s = Math.min(o.max, Math.max(o.min, o.s + o.vel)); o.vel *= Math.pow(0.004, dt); } },
  bar(o, x, y0, y1){ if (o.max - o.min < 1) return; const h = (y1-y0) * 0.18, t = (o.s - o.min) / (o.max - o.min);
    ctx.fillStyle = "rgba(255,255,255,.12)"; rrect(x, y0, 6, y1-y0, 3); ctx.fill();
    ctx.fillStyle = "rgba(255,230,0,.7)"; rrect(x, y1 - h - t*(y1-y0-h), 6, h, 3); ctx.fill(); }
};

// B.9.15: copertina a tutto schermo, finta barra di caricamento di 5 secondi, poi "PREMI PER INIZIARE" nella lingua del sistema
const SPLASH_LOAD = 5;
const Splash = {
  enter(){ this.t = 0; this.buttons = []; this.hold = false; try{ initAudio(); }catch(e){} },
  ready(){ return this.t >= SPLASH_LOAD; },
  go(){ if (!this.ready()) return; initAudio(); go(afterSplash()); Music.startMenu(); },
  update(dt){ this.t += dt; },
  render(){
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    const im = IMG["cover"];
    if (ok(im)){ const s = Math.max(W/im.naturalWidth, H/im.naturalHeight), zoom = 1 + 0.03*Math.min(1, this.t/8);   // lento zoom
      const w = im.naturalWidth*s*zoom, h = im.naturalHeight*s*zoom; ctx.drawImage(im, (W-w)/2, (H-h)/2, w, h); }
    const g = ctx.createLinearGradient(0, 960, 0, H); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.75)");
    ctx.fillStyle = g; ctx.fillRect(0, 960, W, H-960);
    if (!this.ready()){
      // barra di caricamento (finta): rallenta e riparte come quelle vere
      const p = Math.min(1, this.t / SPLASH_LOAD), e = p < 0.6 ? p/0.6*0.7 : 0.7 + (p-0.6)/0.4*0.3, shown = Math.min(1, e + 0.02*Math.sin(this.t*9)*(1-p));
      const bx = 90, by = 1120, bw = 540, bh = 30;
      ctx.fillStyle = "rgba(0,0,0,.75)"; rrect(bx-6, by-6, bw+12, bh+12, 20); ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = YELLOW; rrect(bx-6, by-6, bw+12, bh+12, 20); ctx.stroke();
      ctx.save(); rrect(bx, by, bw, bh, 15); ctx.clip();
      ctx.fillStyle = YELLOW; ctx.fillRect(bx, by, bw*shown, bh);
      ctx.fillStyle = "rgba(0,0,0,.25)"; for (let x = -40 + (this.t*80)%40; x < bw*shown; x += 40){ ctx.beginPath(); ctx.moveTo(bx+x, by+bh); ctx.lineTo(bx+x+18, by+bh); ctx.lineTo(bx+x+38, by); ctx.lineTo(bx+x+20, by); ctx.fill(); }
      ctx.restore();
      const dots = ".".repeat(1 + Math.floor(this.t*3) % 3);
      text(txt("loading_up") + dots, 360, by - 34, 26, "#fff", "center", "#000", 6);
      text(Math.round(shown*100) + "%", 360, by + bh + 34, 22, YELLOW, "center", "#000", 5);
      return;
    }
    const k = Math.min(1, (this.t - SPLASH_LOAD) / 0.4);   // entrata morbida
    ctx.globalAlpha = k;
    ctx.fillStyle = "rgba(0,0,0,.72)"; ctx.fillRect(0, 1040, W, 112); ctx.fillStyle = YELLOW; ctx.fillRect(0, 1040, W, 5); ctx.fillRect(0, 1147, W, 5);
    ctx.globalAlpha = k * (0.6 + 0.4*Math.sin(this.t*4));
    fitText(txt("tap_start"), 360, 1086, 46, 660, YELLOW, "center", "#000", 8); ctx.globalAlpha = k;
    text(txt("with_music"), 360, 1130, 20, "#ddd");
    // banner aggiornamento (solo la scritta)
    { const bx = 110, by = 1172, bw = 500, bh = 58, pulse = 1 + 0.03*Math.sin(this.t*3);
      ctx.save(); ctx.translate(360, by + bh/2); ctx.scale(pulse, pulse); ctx.translate(-360, -(by + bh/2));
      ctx.fillStyle = YELLOW; rrect(bx, by, bw, bh, 18); ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = "#111"; ctx.stroke();
      fitText("🆕 " + txt("upd_title"), 360, by + bh/2 + 2, 22, bw - 26, "#111"); ctx.restore(); }
    ctx.globalAlpha = 1;
  },
  tap(){ this.go(); }, key(){ this.go(); }
};

/* =====================================================================
   ONLINE: classifica e salvataggio progressi (Cloudflare Worker + D1)
   ===================================================================== */
// classifica online: Supabase (progetto stiledigitale_games, funzioni za_*). Indirizzo e chiave pubblica in config.js
const SB = window.ZA_SUPABASE || {};
const SB_URL = String(SB.url || "").replace(/\/+$/, ""), SB_KEY = String(SB.key || "");
const Net = {
  // identità Supabase (chiavi nuove: quelle del vecchio server Cloudflare non valgono più)
  id: store.get("sbid", ""), code: store.get("sbcode", ""), name: store.get("pname", ""),
  online: false, lastRank: null, pending: store.get("pending", []),
  enabled(){ return !!(SB_URL && SB_KEY) && window.ZA_ONLINE !== false; },
  // chiama una funzione za_* del database
  async rpc(fn, args){
    const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 7000);
    try{
      const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, { method:"POST", signal: ctl.signal,
        headers:{ "Content-Type":"application/json", "apikey": SB_KEY }, body: JSON.stringify(args || {}) });
      const j = await r.json().catch(()=>({})); this.online = true;
      if (!r.ok){
        const msg = (j && j.message) || String(r.status);
        // chiave del giocatore non più valida (es. database azzerato): si ricrea il giocatore
        if (msg === "giocatore sconosciuto" && fn !== "za_restore"){ this.setIdentity("", "", this.name); }
        throw new Error(msg);
      }
      return j;
    } catch(e){ if (e.name === "AbortError" || e instanceof TypeError) this.online = false; throw e; }
    finally { clearTimeout(tm); }
  },
  progress(){ return { best, bestCombo: store.get("bestCombo", 0), maxLevel, operator, excavator, rec, medals: Medals.got }; },
  async ensure(){
    if (!this.enabled()) throw new Error("offline");
    if (this.id) return;
    const j = await this.rpc("za_new_player", { p_name: this.name, p_progress: this.progress() });
    this.setIdentity(j.id, j.code, j.name || this.name);
  },
  setIdentity(id, code, name){ this.id = id; this.code = code; this.name = name || ""; store.set("sbid", id); store.set("sbcode", code); store.set("pname", this.name); },
  applyProgress(p){
    if (!p) return;
    if ((p.best|0) > best){ best = p.best|0; store.set("best", best); }
    if ((p.bestCombo|0) > store.get("bestCombo",0)) store.set("bestCombo", p.bestCombo|0);
    if ((p.maxLevel|0) > maxLevel){ maxLevel = p.maxLevel|0; store.set("maxLevel", maxLevel); }
    if (p.medals) Medals.merge(p.medals);
    if (p.rec && typeof p.rec === "object"){ for (const k in p.rec) if ((p.rec[k]|0) > (rec[k]||0)) rec[k] = p.rec[k]|0; store.set("rec", rec); }
  },
  async start(){
    if (!this.enabled()) return;
    try{
      await this.ensure();
      let j; try{ j = await this.rpc("za_get_progress", { p_id: this.id }); }
      catch(e){ if (this.id) throw e; await this.ensure(); j = await this.rpc("za_get_progress", { p_id: this.id }); }  // giocatore ricreato
      if (j.name && !this.name){ this.name = j.name; store.set("pname", j.name); }
      this.applyProgress(j.progress); await this.syncName(); this.flush(); this.saveProgress();
    } catch(e){}
  },
  _t: null,
  saveProgress(){
    if (!this.enabled()) return;
    clearTimeout(this._t);
    this._t = setTimeout(async ()=>{ try{ await this.ensure(); await this.rpc("za_save_progress", { p_id: this.id, p_progress: this.progress() }); } catch(e){} }, 800);
  },
  async submit(run){
    this.lastRank = null;
    if (!this.enabled()) return null;
    try{
      await this.ensure();
      const j = await this.rpc("za_submit_score", this.scoreArgs(run));
      this.lastRank = j.rank; return j.rank;
    } catch(e){ this.pending.push(run); store.set("pending", this.pending.slice(-20)); return null; }
  },
  async flush(){
    const list = this.pending.splice(0); store.set("pending", []);
    for (const run of list){
      try{ await this.rpc("za_submit_score", this.scoreArgs(run)); await new Promise(r=>setTimeout(r, 3200)); }  // il server accetta un punteggio ogni 3 s
      catch(e){ if (!/non valido|nullo/.test(e.message)) this.pending.push(run); }
    }
    store.set("pending", this.pending);
  },
  scoreArgs(run){ return { p_id: this.id, p_mode: run.mode || "road", p_floors: run.floors|0, p_time_ms: run.time_ms|0,
    p_city: run.city|0, p_combo: run.combo|0, p_operator: run.operator|0, p_excavator: run.excavator|0 }; },
  // giocatori collegati ora: ping ogni 30 s (solo con la pagina in primo piano); il server conta chi ha pingato negli ultimi 75 s
  users: null, _pingT: null,
  async ping(){
    if (!this.enabled() || document.hidden) return;
    try{ await this.ensure(); const j = await this.rpc("za_ping", { p_id: this.id }); this.users = j.online|0; } catch(e){}
  },
  startPing(){
    if (!this.enabled()) return;

  // primo avvio: il nome si salva SUBITO sul dispositivo, poi si invia al server (se offline, riprova al prossimo avvio)
  async setNameFirst(n){

const floorVariants = [];
function buildThemes(){
  const src = IMG.floor; if (!ok(src)) return;
  const w = src.naturalWidth, h = src.naturalHeight;
  for (const th of THEMES){
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"); g.drawImage(src, 0, 0);
    if (th.tint === "night"){
      try{
        const d = g.getImageData(0,0,w,h), p = d.data;
        for (let i=0;i<p.length;i+=4){
          const r=p[i], gg=p[i+1], b=p[i+2];
          const blue = b > 150 && b > r + 50 && b > gg + 20;
          if (blue){ const x=(i/4)%w; const lit = ((x>>5) + ((i/4/w)>>5)) % 3 !== 0;
            if (lit){ p[i]=255; p[i+1]=210+((b>220)?30:0); p[i+2]=110; } else { p[i]=25; p[i+1]=35; p[i+2]=70; } }
          else { p[i]=r*0.38; p[i+1]=gg*0.4; p[i+2]=b*0.55; }
        }
        g.putImageData(d,0,0);
      }catch(e){ g.globalCompositeOperation="multiply"; g.fillStyle="#334"; g.fillRect(0,0,w,h); }
    } else if (th.tint){
      g.globalCompositeOperation = "multiply"; g.fillStyle = th.tint; g.fillRect(0,0,w,h);
      g.globalCompositeOperation = "destination-in"; g.drawImage(src,0,0);
    }
    floorVariants.push(c);
  }
}

/* ---------- MUSICA (sequencer semplice) ---------- */
const Music = {
  on:false, next:0, step:0, bpm:112, mode:"game",
  // musica dei menu: groove da cantiere più tranquillo (La- Fa Do Sol)
  menuRoots:[0, 8, 3, 10], menuChords:[[0,3,7],[0,4,7],[0,4,7],[0,4,7]],
  startMenu(){ if (!actx) return; if (this.on && this.mode==="menu") return; this.mode = "menu"; this.bpm = 100; this.start(); },
  startGame(){ this.mode = "game"; this.start(); },
  bass:[0,0,7,0, 5,0,7,10, 0,0,7,0, 3,0,5,7],
  start(){ if (!actx) return; this.on = true; this.next = actx.currentTime + 0.05; this.step = 0; },
  stop(){ this.on = false; },
  tick(){
    if (!this.on || !actx || muted) { if (actx) this.next = actx.currentTime + 0.05; return; }
    const spb = 60/this.bpm/4; // sedicesimi
    while (this.next < actx.currentTime + 0.12){
      const t = this.next, s = this.step % 16;
      if (this.mode === "menu"){ this.menuStep(t, s, Math.floor(this.step/16) % 4, spb); this.next += spb; this.step++; continue; }
      if (s % 4 === 0) this.kick(t);
      if (s % 8 === 4) this.snare(t);
      if (s % 2 === 1) this.hat(t);
      if (s % 2 === 0) this.bassNote(t, 55 * Math.pow(2, this.bass[s]/12), spb*1.8);
      this.next += spb; this.step++;
    }
  },
  menuStep(t, s, bar, spb){
    const root = 55 * Math.pow(2, this.menuRoots[bar]/12);
    if (s === 0 || s === 10) this.kick(t);
    if (s === 4 || s === 12) this.noise(t, 0.12, 1600, 0.28, "bandpass");
    if (s % 2 === 0) this.noise(t, 0.03, 8000, 0.08, "highpass");
    if ([0,3,6,8,11,14].includes(s)) this.bassNote(t, root * ([6,14].includes(s) ? 2 : 1), spb*1.6);
    if ([2,6,10,14].includes(s)) for (const iv of this.menuChords[bar]) this.stab(t, root*4*Math.pow(2, iv/12), spb*1.2);
    if (s === 0 && bar === 0) this.pad(t, root*2, spb*64);
  },
  stab(t, f, dur){ const o=actx.createOscillator(), g=actx.createGain(), fl=actx.createBiquadFilter();
    o.type="square"; o.frequency.value=f; fl.type="lowpass"; fl.frequency.value=1400;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.05,t+0.01); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(fl); fl.connect(g); g.connect(this.out()); o.start(t); o.stop(t+dur+0.02); },
  pad(t, f, dur){ for (const m of [1, 1.5, 2]){ const o=actx.createOscillator(), g=actx.createGain();
    o.type="sine"; o.frequency.value=f*m; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.03,t+1.5); g.gain.linearRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.out()); o.start(t); o.stop(t+dur+0.05); } },
  out(){ if (!this.g){ this.g = actx.createGain(); this.g.gain.value = 0.22; this.g.connect(actx.destination); } return this.g; },
  kick(t){ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+0.12);
    g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15); o.connect(g); g.connect(this.out()); o.start(t); o.stop(t+0.16); },
  noise(t, dur, freq, vol, type){ const n=Math.floor(actx.sampleRate*dur), b=actx.createBuffer(1,n,actx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n); const s=actx.createBufferSource(); s.buffer=b;
    const f=actx.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=actx.createGain(); g.gain.value=vol;
    s.connect(f); f.connect(g); g.connect(this.out()); s.start(t); },
  snare(t){ this.noise(t, 0.14, 1800, 0.45, "bandpass"); },
  hat(t){ this.noise(t, 0.04, 7000, 0.18, "highpass"); },
  bassNote(t, f, dur){ const o=actx.createOscillator(), g=actx.createGain(), fl=actx.createBiquadFilter();
    o.type="sawtooth"; o.frequency.value=f; fl.type="lowpass"; fl.frequency.value=420;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.35,t+0.01); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(fl); fl.connect(g); g.connect(this.out()); o.start(t); o.stop(t+dur+0.02); }
};

// il giorno della sfida segue l'ora italiana (cambia a mezzanotte in Italia, non alle 01:00)
function dailyYMD(){
  const d = new Date();
  try{ const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Rome", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(d), g = t => +p.find(x=>x.type===t).value;
    return [g("year"), g("month"), g("day")]; }
  catch(e){ return [d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()]; }
}
function dailyDayNo(){ const [y,m,dd] = dailyYMD(); return Math.floor(Date.UTC(y, m-1, dd) / 86400000); }
function dailyKey(){ const [y,m,d] = dailyYMD(); return y + String(m).padStart(2,"0") + String(d).padStart(2,"0"); }
function dailyCity(){ return dailyDayNo() % CITIES.length; }
function dailyNum(){ return dailyDayNo() - Math.floor(Date.UTC(2026, 10, 16) / 86400000) + 1; }   // n° 1 = 16/11/2026, la prima sfida
function dailyDate(){ const [, m, d] = dailyYMD(); return String(d).padStart(2,"0") + "/" + String(m).padStart(2,"0"); }
function seededRand(str){ let h = 1779033703; for (const ch of str) { h = Math.imul(h ^ ch.charCodeAt(0), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0; return ()=>{ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// record della sfida: solo quello di oggi (non si accumula nei progressi salvati)

async function shareCanvas(c, text, fname){
  let blob = null; try{ blob = await new Promise(res => c.toBlob(res, "image/png")); }catch(e){}
  try{
    if (blob && navigator.canShare){ const file = new File([blob], fname, { type: "image/png" });
      if (navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], text }); return; } }
    if (navigator.share){ await navigator.share({ text, url: SHARE_URL }); return; }
  }catch(e){ if (e && e.name === "AbortError") return; }
  // computer: si scarica l'immagine e si copia il testo
  try{ if (blob){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click(); a.remove(); } }catch(e){}
  try{ await navigator.clipboard.writeText(text); }catch(e){}
  floatText(txt("share_saved"), 360, 820, 26, YELLOW, 1.4);
}

const mist = [];

function cannonNozzle(c){ return { x: c.x + c.dir*58, y: GROUND_Y - 86 }; }
function spawnMist(c, n, power){
  const nz = cannonNozzle(c);
  for (let i=0;i<n;i++){
    const a = (c.dir > 0 ? -0.62 : Math.PI + 0.62) + (Math.random()-0.5)*0.28, f = (260 + Math.random()*160) * (power||1);
    const life = 1.2 + Math.random()*0.9;
    mist.push({ x: nz.x, y: nz.y, vx: Math.cos(a)*f, vy: Math.sin(a)*f, life, max: life, r: 4 + Math.random()*4 });
  }
}
function updateMist(dt){
  for (const c of CANNONS) if (Math.random() < dt*40) spawnMist(c, 1);
  for (let i=mist.length-1;i>=0;i--){ const m = mist[i];
    m.life -= dt; m.vx *= Math.pow(0.35, dt); m.vy = m.vy*Math.pow(0.35, dt) + 40*dt; m.x += m.vx*dt; m.y += m.vy*dt; m.r += 22*dt;
    if (m.life <= 0) mist.splice(i,1); }
  if (mist.length > 400) mist.splice(0, mist.length-400);
}

}

  },
  emptyRow(r){ r.side = -1; r.item = null; r.hidden = false; r.dying = false; r.deco = null; r.beam = null; },
  // generatore dei piani: balconi, piani vuoti, raffiche sullo stesso lato, bonus
  genRow(r, below){
    this.emptyRow(r);

    if (below && below.beam) return; // respiro: sopra la trave un piano libero
    // ogni tanto una trave in cemento armato: va presa a picconate 10 volte
    const R = this.rand || Math.random;
    if (this.score >= 12 && this.sinceBeam >= 12 && R() < 0.12 && !(below && below.beam)){
      r.beam = makeBeam(); this.sinceBeam = 0; return;
    }
    const prevSide = below ? below.side : -1;
    const diff = Math.min(1, this.score / 150);
    const emptyChance = prevSide === -1 ? 0.18 : 0.38 - diff*0.18;
    if (R() < emptyChance){
      if (this.score > 4 && R() < 0.17){
        r.item = this.pickItem();
        r.itemSide = R() < 0.5 ? 0 : 1;
      }
      return;
    }
    // raffica: con la difficoltà aumenta la probabilità di ripetere lo stesso lato

  // bonus: i classici più spesso, TNT e mattone d'oro rari

    if (this.score >= 30) pool.push(["gold",5]);
    if (this.score >= 60 && (this.lives|0) < 3) pool.push(["life",6]);

  start(){ if (!this.started){ this.started = true; Music.startGame(); } },

  chop(dir){

    const now = this.t;

  breakBeam(bRow){

  scoreMedals(){ if (this.score >= 100) Medals.award("m100"); if (this.score >= 300) Medals.award("m300"); },
  // il palazzo scende di un piano. safe = colpo "gratis" (martello turbo, TNT): i balconi si rompono e non schiacciano
  advance(dir, safe, quiet){
    const pts = this.x2 > 0 ? 2 : 1;

    if (!quiet) floatText("+" + pts, dir===0 ? 270 : 450, 960, 34, pts>1 ? YELLOW : "#fff", 0.6);

    this.shift = -FLOOR_H; this.floorsDown++; this.camShake = Math.max(this.camShake, 0.1);

    sfx.chop();

    for (const r of this.rows) r.y += FLOOR_H;

    for (const r of this.rows){

        else if (this.inv > 0) r.dying = true;   // appena ripartiti: un attimo di respiro
        else this.die("crush");

    }

  collect(type, r){

  playerX(){ return this.side===0 ? 0 : 1; },
  lv(){
    if (this.mode !== "road") return;

    if (lv > this.level){ this.transit = { t: 0, from: this.level, to: lv }; this.prevTheme = this.level % THEMES.length; this.prevLevel = this.level; this.level = lv;

  recKey(){ return this.mode === "single" ? "s" + this.level : (this.mode === "daily" ? "d" + dailyKey() : "road"); },

  beamRow(){ return this.rows.find(r => r.beam && r.y >= ROW_MIN && r.y <= ROW_MAX); },

  // vita extra: invece di perdere si riparte da qui (barra piena, ostacoli davanti tolti)
  revive(reason){
    this.lives--; this.energy = 1; this.inv = 1.5; this.flash = 0.5; this.camShake = 0.3;
    for (const r of this.rows) if (r.y >= ROW_MIN - FLOOR_H && r.y <= ROW_MAX + FLOOR_H){ if (r.side !== -1) r.dying = true; if (r.beam){ r.beam = null; r.hidden = true; } }

  die(reason){
    if (this.over) return;
    if ((this.lives|0) > 0){ this.revive(reason); return; }
    this.over = true; this.reason = reason; this.overT = 0; this.pending = reason; Music.stop();
    if (this.score > best){ best = this.score; store.set("best", best); }
    const rk = this.recKey(); this.newRecord = this.score > 0 && this.score > this.recGet();

    if (this.mode === "daily" && this.score >= 50) Medals.award("daily");

      city: this.level, combo: this.bestCombo, name: Net.name }).then(r=>{ this.rank = r; this.rankState = r ? "ok" : "fail"; });

  update(dt){
    Music.bpm = 112 + Math.min(this.level, 6)*8; Music.tick();
    this.buttons.forEach(b=>b.update(dt));
    const playing = this.started && !this.over;
    this.startBtn.visible = !this.started && !this.over;
    this.leftBtn.visible = this.rightBtn.visible = !this.over && !this.paused;
    this.pauseBtn.visible = !this.over && !this.paused && !this.transit;
    this.resumeBtn.visible = this.pRestartBtn.visible = this.pMenuBtn.visible = this.pMuteBtn.visible = this.paused;
    this.retryBtn.visible = this.homeBtn.visible = this.shareBtn.visible = this.over && this.overT > 0.6;
    if (this.paused) return;
    if (this.transit){
      this.transit.t += dt; this.t += dt; Music.bpm = 140;
      this.leftBtn.visible = this.rightBtn.visible = this.pauseBtn.visible = false;
      if (this.transit.t >= TRANSIT_DUR){ this.transit = null; this.themeMix = 1; this.levelBanner = 2.2; parts.length = 0; this.chunks.length = 0; }
      return;
    }

    this.t += dt;
    this.cloudX += 14*dt; if (this.cloudX > W) this.cloudX = -380;
    this.scorePop = Math.max(0, this.scorePop - dt*5);
    this.camShake = Math.max(0, this.camShake - dt);
    this.levelBanner = Math.max(0, this.levelBanner - dt);
    this.themeMix = Math.min(1, this.themeMix + dt*0.8);
    this.flash = Math.max(0, this.flash - dt);
    this.x2 = Math.max(0, this.x2 - dt);
    this.coffee = Math.max(0, this.coffee - dt); this.turbo = Math.max(0, this.turbo - dt); this.inv = Math.max(0, (this.inv||0) - dt);
    // TNT: 5 piani saltano uno dopo l'altro
    if (this.tnt && !this.over){ this.tnt.t -= dt;
      if (this.tnt.t <= 0){ this.tnt.t = 0.11; this.tnt.n--;
        const b = this.beamRow(); if (b) this.breakBeam(b); else this.advance(this.side, true, true);
        for (let k=0;k<3;k++) burst(BUILD_X + 30 + Math.random()*210, 900 + Math.random()*120, 270, 360, 18, true);
        this.camShake = 0.25; sfx.smash(); if (this.tnt && this.tnt.n <= 0) this.tnt = null; } }
    this.updateEvent(dt);
    for (const r of this.rows) if (r.beam && r.beam.hitT > 0) r.beam.hitT = Math.max(0, r.beam.hitT - dt);
    this.slide = Math.min(1, this.slide + dt/PLAYER_SLIDE);
    if (this.t - this.lastChop > 0.6) this.combo = 0;

    if (this.shift < 0) this.shift = Math.min(0, this.shift + FLOOR_H*dt/0.07);
    if (this.shift > -40){
      for (const r of this.rows) if (r.dying){
        r.dying=false; r.hidden=true;
        burst(balX(r)+r.bw/2, r.y+29, r.side===0?200:340, 120, 22, true); sfx.smash();
        petals(balX(r)+r.bw/2, r.y+10, r.deco);
      }
      if (this.pending){
        this.shake = 0.6; this.camShake = 0.35; sfx.crash();
        if (navigator.vibrate) try{ navigator.vibrate(120); }catch(e){}
        const px = this.side===0 ? 80 : 640;
        burst(px, 1000, 270, 160, 40, true); dust(px, 1060, 8);
        if (this.newRecord) setTimeout(()=>sfx.record(), 500);
        this.pending = null;
      }
    }

    if (playing){
      this.playTime += dt;
      if (this.timerStarted){
        // difficoltà (B.9.9): sale fino a 300 piani, poi +0,002 per ogni città; a Roma servono ~3,8 piani al secondo (prima 5,8: impossibile)
        const drain = 0.10 + 0.10*Math.min(1, this.score/300) + 0.002*Math.min(19, Math.floor(this.score/LEVEL_EVERY));
        if (this.coffee <= 0) this.energy -= drain*dt;   // col caffè la barra resta ferma
        if (this.energy <= 0){ this.energy = 0; this.die(this.beamRow() ? "beam" : "time"); }
      }
    }
    if (this.over) this.overT += dt;
    this.shake = Math.max(0, this.shake - dt);

    this.animT += dt;
    if (this.anim === "idle"){ this.frame = Math.floor(this.animT / (1/30)) % 6; }
    else { this.frame = Math.floor(this.animT / (1/60)); if (this.frame >= 17){ this.anim="idle"; this.animT=0; this.frame=0; } }

    for (let i=this.chunks.length-1;i>=0;i--){ const c=this.chunks[i];
      c.vy += 1500*dt; c.x += c.vx*dt; c.y += c.vy*dt; c.rot += c.vr*dt; c.life -= dt;
      if (c.life<=0 || c.y>H+100) this.chunks.splice(i,1); }
    for (let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.life-=dt; f.y-=60*dt; if (f.life<=0) floats.splice(i,1); }
    updateParts(dt); updateMist(dt);
  },

  // eventi delle città (Bora, acqua alta, nebbia, Vesuvio): brevi, con avviso
  updateEvent(dt){
    if (!this.started || this.over || !this.timerStarted){ return; }
    const type = CITY_EVENTS[this.level % CITIES.length];
    if (!type){ this.ev = null; return; }
    if (!this.ev){ this.evNext -= dt;
      if (this.evNext <= 0){ this.ev = { type, t: 0, dur: type === "nebbia" ? 6 : 5.5 };
        floatText(txt("ev_" + type), 360, 330, 44, "#bfe6ff", 1.8); [330, 262, 196].forEach((f,i)=>setTimeout(()=>tone(f, 0.18, 0.12, "sawtooth"), i*120)); }
      return; }
    const e = this.ev; e.t += dt;
    if (e.type === "vesuvio"){ e.rumble = (e.rumble||0) - dt; if (e.rumble <= 0){ e.rumble = 0.55 + Math.random()*0.4; this.camShake = Math.max(this.camShake, 0.2*this.evK()); tone(55, 0.35, 0.2, "sawtooth"); } }
    if (e.type === "bora" && Math.random() < dt*6) for (const c of CANNONS) spawnMist(c, 2, 0.6);
    if (e.t >= e.dur){ this.ev = null; this.evNext = 18 + Math.random()*14; Medals.award(type); floatText(txt("ev_done"), 360, 330, 40, "#3ddc4a", 1.1); }
  },
  evK(){ const e = this.ev; return e ? Math.max(0, Math.min(1, e.t/0.7, (e.dur - e.t)/0.7)) : 0; },
  renderEvent(stage){
    const e = this.ev; if (!e) return; const k = this.evK(), t = this.t;
    if (stage === "back"){
      if (e.type === "nebbia"){ // la nebbia nasconde i piani in arrivo
        const g = ctx.createLinearGradient(0, 0, 0, 960); g.addColorStop(0, `rgba(214,220,226,${0.97*k})`); g.addColorStop(0.7, `rgba(214,220,226,${0.92*k})`); g.addColorStop(1, "rgba(214,220,226,0)");
        ctx.fillStyle = g; ctx.fillRect(-30, -30, W+60, 990);
        ctx.globalAlpha = 0.35*k; for (let i=0;i<7;i++){ const x = ((t*28*(i%2?1:-1) + i*170) % (W+300) + W+300) % (W+300) - 150; blob(x, 260 + i*95, 120, "#eef2f5"); } ctx.globalAlpha = 1; }
      return; }
    if (e.type === "bora"){ ctx.strokeStyle = `rgba(255,255,255,${0.55*k})`; ctx.lineWidth = 3;
      for (let i=0;i<22;i++){ const y = (i*97 + 40) % 1080, x = ((t*1400 + i*263) % (W+400)) - 200, L = 80 + (i%4)*40;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x+L/2, y-6, x+L, y); ctx.stroke(); } }
    if (e.type === "acqua"){ const top = GROUND_Y - 80*k;
      const g = ctx.createLinearGradient(0, top, 0, GROUND_Y); g.addColorStop(0, "rgba(70,150,190,.78)"); g.addColorStop(1, "rgba(30,90,130,.9)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-30, GROUND_Y+4); for (let x=-30; x<=W+30; x+=20) ctx.lineTo(x, top + Math.sin(x*0.03 + t*3)*5); ctx.lineTo(W+30, GROUND_Y+4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${0.5*k})`; for (let i=0;i<14;i++){ const x = (i*61 + t*40) % W; ctx.fillRect(x, top + 12 + (i%4)*14, 18, 2); } }
    if (e.type === "vesuvio"){ ctx.fillStyle = `rgba(255,120,40,${0.12*k})`; ctx.fillRect(-30,-30,W+60,H+60);
      ctx.fillStyle = `rgba(70,70,70,${0.6*k})`; for (let i=0;i<70;i++){ const x = (i*97.3 + Math.sin(i)*50 + t*20) % W, y = (i*53 + t*(60 + (i%5)*20)) % 1100; ctx.fillRect(x, y, 3, 3); } }
  },

  drawSky(th, alpha){
    ctx.save(); ctx.globalAlpha = alpha;
    const g = ctx.createLinearGradient(0,0,0,1100); g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(-30,-30,W+60,H+60);
    if (th.night){
      for (const s of STARS){ ctx.globalAlpha = alpha*(0.5+0.5*Math.sin(this.t*2+s.p)); ctx.fillStyle="#fff"; ctx.fillRect(s.x, s.y, s.s, s.s); }
      ctx.globalAlpha = alpha; blob(590, 250, 46, "#fff6d0"); blob(572, 238, 44, th.sky[0]);
    }
    ctx.restore();
  },

  render(){
    if (this.transit){ drawTruckScene(this.transit, this.t); return; }
    const cs = this.camShake > 0 ? this.camShake*40 : 0;
    const th = THEMES[this.level % THEMES.length], pth = THEMES[this.prevTheme], mix = this.level ? this.themeMix : 1;
    ctx.save();
    if (cs) ctx.translate((Math.random()-0.5)*cs, (Math.random()-0.5)*cs);
    if (mix < 1) this.drawSky(pth, 1);
    this.drawSky(th, mix);
    if (!th.night || mix < 1){
      ctx.globalAlpha = th.night ? 1-mix : 1;
      img("cloud", this.cloudX, 311, 363, 141);
      img("cloud", ((this.cloudX + 520) % (W+380)) - 380, 120, 254, 99);
      ctx.globalAlpha = 1;
    }
    if (mix < 1) drawCityScene(this.prevLevel, pth, 1);
    drawCityScene(this.level, th, mix);

    const over = (o,a)=>{ if (o && a>0){ ctx.globalAlpha=a; ctx.fillStyle=o; ctx.fillRect(-30,700,W+60,450); ctx.globalAlpha=1; } };
    if (mix < 1) over(pth.bgOver, 1-mix);
    over(th.bgOver, mix);
    // B.9.12: sfondo più scuro e ombra ai lati del palazzo, per far risaltare palazzo e balconi
    ctx.fillStyle = th.night ? "rgba(5,8,25,.18)" : "rgba(25,18,45,.30)"; ctx.fillRect(-30, -30, W+60, 1142);
    for (const [x0, x1] of [[BUILD_X-70, BUILD_X], [BUILD_X+BUILD_W+70, BUILD_X+BUILD_W]]){
      const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.38)");
      ctx.fillStyle = g; ctx.fillRect(Math.min(x0,x1), -30, 70, 1142); }

    // palazzo
    const sh = this.shift;
    for (let k=-1;k<8;k++){
      const y = GROUND_Y - k*FLOOR_H + sh, v = ((this.floorsDown + k + 3) * 7) % 3;
      if (mix < 1) ctx.drawImage(floorFor(this.prevLevel, this.prevTheme, v), BUILD_X, y, BUILD_W, FLOOR_H);
      ctx.globalAlpha = mix; ctx.drawImage(floorFor(this.level, this.level % THEMES.length, v), BUILD_X, y, BUILD_W, FLOOR_H); ctx.globalAlpha = 1;
    }
    // B.9.12b: contorno scuro del palazzo, come i balconi (bordo + ombra interna)
    ctx.fillStyle = "#1c130b"; ctx.fillRect(BUILD_X - 4, -30, 5, GROUND_Y + FLOOR_H + 30); ctx.fillRect(BUILD_X + BUILD_W - 1, -30, 5, GROUND_Y + FLOOR_H + 30);
    { const gi = ctx.createLinearGradient(BUILD_X, 0, BUILD_X + 22, 0); gi.addColorStop(0, "rgba(0,0,0,.28)"); gi.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = gi; ctx.fillRect(BUILD_X + 1, -30, 22, GROUND_Y + FLOOR_H + 30);
      const gr = ctx.createLinearGradient(BUILD_X + BUILD_W, 0, BUILD_X + BUILD_W - 22, 0); gr.addColorStop(0, "rgba(0,0,0,.28)"); gr.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = gr; ctx.fillRect(BUILD_X + BUILD_W - 23, -30, 22, GROUND_Y + FLOOR_H + 30); }
    // balconi + bonus
    for (const r of this.rows){
      const by = r.y + sh;
      if (r.item) drawItem(r.item, r.itemSide===0 ? 170 : 530, by + 20, this.t + r.y*0.01);
      if (r.beam){ drawBeam(r.beam, by + BEAM_DY, this.t); continue; }
      if (r.side === -1 || r.hidden) continue;
      const sway = this.ev && this.ev.type === "bora" ? Math.sin(this.t*7 + r.y*0.013)*14*this.evK() : 0;
      if (sway){ ctx.save(); ctx.translate(sway, 0); drawBalconyRow(r, by, FACADES[this.level % FACADES.length].trim); ctx.restore(); }
      else drawBalconyRow(r, by, FACADES[this.level % FACADES.length].trim);
    }
    if (th.night && mix > 0.5){ ctx.globalAlpha = 0.18; ctx.fillStyle = "#0a0f3c"; ctx.fillRect(-30,-30,W+60,1142); ctx.globalAlpha = 1; }
    this.renderEvent("back");

    // pezzi di facciata
    for (const c of this.chunks){ if (!c.img) continue;
      ctx.save(); ctx.globalAlpha = Math.min(1, c.life*2); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
      ctx.drawImage(c.img, c.sx*RS, c.sy*RS, c.sw*RS, c.sh*RS, -c.sw/2, -c.sh/2, c.sw, c.sh); ctx.restore(); }

    for (const c of CANNONS) drawCannon(c, this.t);
    // escavatore (con scivolata da un lato all'altro)
    {
      drawExcavator(excavator, (this.anim==="idle"?"idle":"demo")+this.frame, this.side, this.slideFrom, this.slide, GROUND_Y, this.t, this.shake>0);
      if (this.shield){ const hx = this.side===0 ? 70 : 650; ctx.font="40px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.globalAlpha = 0.75+0.25*Math.sin(this.t*6); ctx.fillText("⛑️", hx, 880); ctx.globalAlpha=1; }
    }

    drawParts();
    drawMist();
    this.renderEvent("front");

    // terreno
    ctx.fillStyle = "#111"; ctx.fillRect(-30, GROUND_Y, W+60, H-GROUND_Y+30);
    ctx.save(); ctx.beginPath(); ctx.rect(0,GROUND_Y,W,16); ctx.clip();
    ctx.fillStyle = YELLOW; ctx.fillRect(0,GROUND_Y,W,16); ctx.fillStyle = "#111";
    for (let x=-20;x<W+20;x+=40){ ctx.beginPath(); ctx.moveTo(x,GROUND_Y+16); ctx.lineTo(x+20,GROUND_Y); ctx.lineTo(x+40,GROUND_Y); ctx.lineTo(x+20,GROUND_Y+16); ctx.fill(); }
    ctx.restore();
    ctx.restore();

    if (this.flash > 0){ ctx.globalAlpha = this.flash; ctx.fillStyle = "#fff"; ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1; }
    this.leftBtn.render(); this.rightBtn.render();
    this.renderHUD();
  },

  renderHUD(){
    // barra del tempo
    const frac = this.over ? 0 : this.energy;
    ctx.fillStyle = "#111"; rrect(156, 66, 408, 44, 12); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = YELLOW; ctx.stroke();
    if (frac > 0){
      const low = frac < 0.25 && this.started;
      ctx.fillStyle = this.coffee > 0 ? "#8fd3ff" : frac > 0.5 ? "#3ddc4a" : frac > 0.25 ? "#ffcc00" : (Math.floor(this.t*8)%2 ? "#ff3b30" : "#ff7a70");
      rrect(164, 74, 392*frac, 28, 7); ctx.fill();
      if (low){ ctx.globalAlpha=0.25*(1+Math.sin(this.t*20)); ctx.fillStyle="#ff0000"; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
    }
    // punteggio
    const s = 1 + this.scorePop*0.25;
    ctx.save(); ctx.translate(360, 178); ctx.scale(s,s); text(String(this.score), 0, 0, 84, this.x2>0?YELLOW:"#fff", "center", "#000", 12); ctx.restore();
    const st = []; if (this.x2 > 0) st.push(["x2 " + Math.ceil(this.x2) + "s", YELLOW]);
    if (this.coffee > 0) st.push(["☕ " + Math.ceil(this.coffee) + "s", "#ffe0b2"]); if (this.turbo > 0) st.push(["🔨 " + Math.ceil(this.turbo) + "s", "#ffb74d"]);
    st.forEach(([sx, c], i)=> text(sx, 360 + (i - (st.length-1)/2)*150, 240, 26, c, "center", "#000", 6));
    if (this.combo >= 5 && !this.over) text("COMBO " + this.combo, 360, st.length ? 280 : 245, 26, "#fff", "center", "#000", 6);
    // livello
    fitText(cityName(this.level), 62, 160, 18, 120, YELLOW, "center", "#000", 5);
    if (this.mode === "road"){ const left = LEVEL_EVERY - (this.score % LEVEL_EVERY);
      fitText(txt("next_city", left), 62, 184, 13, 124, "#fff", "center", "#000", 4); }
    else text(txt(this.mode === "daily" ? "daily_short" : "single_short"), 62, 184, 13, "#fff", "center", "#000", 4);
    if (this.lives > 0) text("❤️".repeat(this.lives), 62, 214, 22, "#ff4d6d", "center");
    // operatore
    const op = IMG["op"+OPS[operator]];
    if (ok(op)){ ctx.save(); ctx.beginPath(); ctx.arc(62, 88, 44, 0, Math.PI*2); ctx.fillStyle=YELLOW; ctx.fill();
      ctx.beginPath(); ctx.arc(62, 88, 39, 0, Math.PI*2); ctx.clip(); img("op"+OPS[operator], 23, 49, 78, 78); ctx.restore(); }
    drawTrophy(620, 86, 54, this.t); text(String(Math.max(this.recGet(), this.score)), 676, 88, 30, "#fff", "center", "#000", 7);
    this.pauseBtn.render();

    // testi volanti
    for (const f of floats){ ctx.globalAlpha = Math.min(1, f.life/f.max*2); text(f.str, f.x, f.y, f.size, f.col, "center", "#000", f.size*0.18); }
    ctx.globalAlpha = 1;

    // trave da demolire
    const bRow = !this.over && this.beamRow();
    if (bRow){
      const pulse = 1 + 0.06*Math.sin(this.t*18);
      ctx.save(); ctx.translate(360, 700); ctx.scale(pulse, pulse);
      ctx.fillStyle = "rgba(0,0,0,.78)"; rrect(-250, -62, 500, 124, 20); ctx.fill();
      ctx.lineWidth = 5; ctx.strokeStyle = YELLOW; ctx.stroke();
      fitText(txt("beam_title"), 0, -30, 34, 470, YELLOW);
      fitText(txt("beam_sub"), 0, 4, 22, 470, "#fff");
      const f = bRow.beam.hp / BEAM_HP;
      ctx.fillStyle = "#333"; rrect(-200, 26, 400, 22, 8); ctx.fill();
      ctx.fillStyle = "#ff3b30"; rrect(-200, 26, 400*f, 22, 8); ctx.fill();
      text(bRow.beam.hp + " / " + BEAM_HP, 0, 38, 16, "#fff");
      ctx.restore();
    } else if (!this.over){
      // avviso: trave in arrivo
      const next = this.rows.find(r => r.beam && r.y >= 640 && r.y < ROW_MIN);
      if (next && Math.floor(this.t*4)%2===0) text(txt("beam_coming"), 360, 320, 30, "#ff6b5e", "center", "#000", 6);
    }

    // banner livello
    if (this.levelBanner > 0){
      const t = this.levelBanner, a = Math.min(1, t*3, (2.2-t)*4);
      ctx.save(); ctx.globalAlpha = a;
      ctx.fillStyle = "rgba(0,0,0,.75)"; ctx.fillRect(0, 470, W, 150);
      ctx.fillStyle = YELLOW; ctx.fillRect(0, 470, W, 6); ctx.fillRect(0, 614, W, 6);
      fitText(txt("welcome_city", cityName(this.level)), 360, 520, 48, 680, YELLOW, "center", "#000", 8);
      text(txt("level_line", this.level+1, txt("th" + (this.level % THEMES.length))), 360, 580, 20, "#fff");
      ctx.restore();
    }

    if (!this.started && !this.over){
      ctx.fillStyle = "rgba(0,0,0,.6)"; rrect(60, 310, 600, 380, 26); ctx.fill();
      fitText(txt("help1"), 360, 355, 30, 560, "#fff");
      fitText(txt("help2"), 360, 398, 24, 560, "#ddd");
      fitText(txt("help3"), 360, 432, 24, 560, "#ddd");
      ctx.font = "30px sans-serif"; ctx.textAlign="center"; ctx.fillText("⏱️ ⛑️ ⭐ ☕ 🔨 🧨", 360, 485);
      fitText(txt("help4"), 360, 528, 24, 560, YELLOW);
      fitText(txt("help5"), 360, 572, 24, 560, "#fff");
      fitText(txt("good_luck"), 360, 638, 40, 560, YELLOW, "center", "#000", 7);
      this.startBtn.render();
    }

    if (this.paused){
      ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillRect(0,0,W,H);
      text(txt("pause"), 360, 440, 80, YELLOW, "center", "#000", 10);
      this.resumeBtn.render(); this.pRestartBtn.render(); this.pMenuBtn.render(); this.pMuteBtn.render();
    }

    if (this.over && this.overT > 0.35){
      const a = Math.min(1, (this.overT-0.35)*4);
      ctx.save(); ctx.globalAlpha = a;
      ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0,0,W,H);
      const py = 270 + (1-a)*60;
      ctx.fillStyle = "rgba(10,10,10,.93)"; rrect(60, py, 600, 840, 30); ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = YELLOW; rrect(60, py, 600, 840, 30); ctx.stroke();
      const ttl = txt("over_" + this.reason), sub = txt("sub_" + this.reason);
      fitText(ttl, 360, py+70, this.reason==="crush"?64:50, 560, YELLOW, "center", "#000", 8);
      fitText(sub, 360, py+122, 22, 560, "#ddd");
      fitText(txt(this.mode === "single" ? "floors_single" : this.mode === "daily" ? "floors_daily" : "floors_road"), 360, py+178, 26, 560, "#aaa");
      text(String(this.score), 360, py+262, 120, "#fff", "center", "#000", 10);
      if (this.newRecord){ drawTrophy(150, py+262, 110, this.overT); drawTrophy(570, py+262, 110, this.overT+1.5);
        if (Math.floor(this.overT*3)%2===0) fitText(txt("new_record"), 360, py+352, 36, 540, YELLOW); }
      else { drawTrophy(250, py+350, 50, this.overT); fitText(txt("record_colon", this.recGet()), 290, py+352, 32, 340, "#fff", "left"); }
      // statistiche
      const stats = [[txt("city"), cityName(this.level)], [txt("combo_max_up"), String(this.bestCombo)], [txt("time"), fmtTime(this.playTime*1000)]];
      stats.forEach(([k,v],i)=>{ const x = 160 + i*200;
        ctx.fillStyle="rgba(255,255,255,.08)"; rrect(x-85, py+392, 170, 96, 14); ctx.fill();
        fitText(k, x, py+418, 18, 156, "#aaa"); fitText(v, x, py+458, 36, 156, "#fff"); });
      const nm = IMG["name"+OPS[operator]];
      if (ok(nm)){ const s=0.75, w=nm.naturalWidth*s, h=nm.naturalHeight*s; img("name"+OPS[operator], 360-w/2, py+512, w, h); }
      if (this.rankState === "sending") text(txt("sending"), 360, py+585, 20, "#aaa");
      else if (this.rankState === "ok") fitText(txt("pos_rank", this.rank), 360, py+585, 24, 560, YELLOW);
      else if (this.rankState === "fail") fitText(txt("rank_fail"), 360, py+585, 18, 560, "#ff8a80");
      ctx.restore();
      this.retryBtn.render(); this.homeBtn.render(); this.shareBtn.render();
    }
  },

  key(k){
    if (k==="Escape" || k==="p" || k==="P"){ if (this.paused) this.setPause(false); else if (!this.over) this.setPause(true); else go(Menu); return; }
    if (this.paused){ if (k==="Enter"||k===" ") this.setPause(false); return; }
    if (k==="ArrowLeft") this.chop(0);
    else if (k==="ArrowRight") this.chop(1);
    else if ((k==="Enter"||k===" ") && this.over && this.overT>0.6) go(Game);
    else if ((k==="Enter"||k===" ") && !this.started) this.start();
  },
  tap(x,y){ if (!this.over && !this.paused && y > 300) this.chop(x < W/2 ? 0 : 1); }
};
document.addEventListener("visibilitychange", ()=>{ if (document.hidden && scene===Game && Game.started && !Game.over) Game.setPause(true); });

/* =====================================================================
   INPUT
   ===================================================================== */
function toLogical(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener("pointerdown", e=>{
  e.preventDefault(); initAudio(); if (scene !== Game) Music.startMenu();
  // la pagina gira dentro un riquadro: senza focus la tastiera non arriva
  try{ window.focus(); cv.focus({preventScroll:true}); }catch(_){}
  const p = toLogical(e);
  pointer = {x:p.x, y:p.y, mouse: e.pointerType==="mouse"};
  if (LangUI.on() && LangUI.down(p.x, p.y)) return;   // bandierina della lingua
  const btn = (scene.buttons||[]).find(b=>b.hit(p.x,p.y));
  if (btn){ btn.press = 1; if (!btn.silent && btn !== Game.startBtn) sfx.click(); btn.onClick(); return; }
  if (scene.down) scene.down(p.x,p.y);
  if (scene.tap) scene.tap(p.x,p.y);
});
cv.addEventListener("pointerup", e=>{ const p = toLogical(e); if (scene.up) scene.up(p.x,p.y); });
cv.addEventListener("pointermove", e=>{
  const p = toLogical(e);
  if (scene.move && e.buttons) scene.move(p.x, p.y);   // trascinamento (liste che scorrono)
  pointer = {x:p.x, y:p.y, mouse: e.pointerType==="mouse"};
  const over = (scene.buttons||[]).some(b=>b.hit(p.x,p.y)) || (LangUI.on() && (LangUI.inBtn(p.x,p.y) || LangUI.optAt(p.x,p.y) >= 0));
  cv.style.cursor = over ? "pointer" : "default";
});
cv.addEventListener("pointerleave", ()=>{ pointer.x = pointer.y = -1; });
cv.addEventListener("contextmenu", e=>e.preventDefault());
cv.addEventListener("wheel", e=>{ if (scene.wheel){ e.preventDefault(); scene.wheel(e.deltaY); } }, { passive: false });
addEventListener("keydown", e=>{
  if (e.repeat) return;
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  initAudio(); if (scene !== Game) Music.startMenu();
  if (["ArrowLeft","ArrowRight"," ","Enter"].includes(e.key)) e.preventDefault();
  // A/D e frecce, indipendenti da maiuscole e layout di tastiera
  const map = {KeyA:"ArrowLeft", KeyD:"ArrowRight", ArrowLeft:"ArrowLeft", ArrowRight:"ArrowRight", Numpad4:"ArrowLeft", Numpad6:"ArrowRight"};
  const k = map[e.code] || e.key;
  if (k==="ArrowLeft"||k==="ArrowRight") e.preventDefault();
  scene.key && scene.key(k);
});

/* =====================================================================
   LOOP
   ===================================================================== */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  scene.update(dt); LangUI.update(dt); Medals.update(dt);
  if (scene !== Game) Music.tick();
  ctx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  scene.render();
  if (LangUI.on()) LangUI.render();
  Medals.render();
  // contatore dei giocatori collegati: solo il numero, piccolo, nell'angolo in alto a destra
  if (Net.users){ ctx.font = `900 15px ${FONT}`; ctx.textAlign = "right"; ctx.textBaseline = "top";
    ctx.lineWidth = 3; ctx.lineJoin = "round"; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.strokeText(String(Net.users), W-8, 4);
    ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.fillText(String(Net.users), W-8, 4); }
  requestAnimationFrame(frame);
}
function drawLoading(){
  ctx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
  text("ZA DEMOLITION", 360, 580, 54, YELLOW);
  ctx.fillStyle="#333"; rrect(160,650,400,22,11); ctx.fill();
  ctx.fillStyle=YELLOW; rrect(160,650,400*loaded/imgList.length,22,11); ctx.fill();
  if (!scene) requestAnimationFrame(drawLoading);
}
drawLoading();
try{ window.focus(); cv.focus(); }catch(_){}
loadImages().then(()=>{ buildThemes(); go(Splash); Net.start().then(()=>Net.startPing()); last = performance.now(); requestAnimationFrame(frame); });
</script>
